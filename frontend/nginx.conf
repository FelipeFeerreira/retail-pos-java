server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 5m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
 location /api/ {
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 660s;
 }
 location /ws/ {
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_read_timeout 3600s;
 }
 location ~ ^/(swagger-ui|v3/api-docs) {
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
 }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 location / { try_files $uri $uri/ /index.html; }
}
