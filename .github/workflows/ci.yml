name: Build and test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B -ntp -f backend/pom.xml verify
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: bash scripts/setup.sh
      - run: docker compose up --build -d --wait --wait-timeout 240
      - name: Real sale end-to-end
        run: |
          export CYPRESS_ADMIN_PASSWORD="$(sed -n 's/^ADMIN_PASSWORD=//p' .env)"
          cd frontend
          npm run e2e
      - if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
            frontend/coverage
            frontend/cypress/screenshots
            compose.log
      - if: always()
        run: docker compose down
