services:
  frontend:
    ports:
      - "127.0.0.1:3443:443"
    volumes:
      - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
  backend:
    environment:
      APP_ORIGIN: https://localhost:3443
      REQUIRE_HTTPS: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "X-Forwarded-Proto: https", "http://localhost:8080/actuator/health"]
