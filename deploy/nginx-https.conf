server {
 listen 80;
 return 301 https://localhost:3443$request_uri;
}
server {
 listen 443 ssl;
 ssl_certificate /etc/nginx/certs/localhost.crt;
 ssl_certificate_key /etc/nginx/certs/localhost.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_name localhost;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 5m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss:; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
 location /api/ {
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 660s;
 }
 location /ws/ {
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Host $host;
  proxy_read_timeout 3600s;
 }
 location ~ ^/(swagger-ui|v3/api-docs) {
  proxy_pass http://backend:8080;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Host $host;
 }
 location / { try_files $uri $uri/ /index.html; }
}
